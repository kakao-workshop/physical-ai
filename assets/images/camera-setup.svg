<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">카메라와 조명 배치</title>
  <desc id="d">작업대 위에서 탑뷰 카메라가 시작 위치부터 목표 지점까지 담고, 손목 카메라가 그리퍼와 물체를 함께 담으며, 조명은 작업대 전체를 고르게 비춘다</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #27262b; }
    .h { font-size: 14.5px; font-weight: 700; }
    .b { font-size: 13px; fill: #3d3b42; }
    .s { font-size: 12px; fill: #5c5962; }
    .arm { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="800" height="340" fill="#ffffff"/>

  <!-- 조명 -->
  <circle cx="70" cy="52" r="16" fill="#fff4cc" stroke="#d8a400" stroke-width="2"/>
  <path d="M88,64 L180,170 M80,72 L120,240 M96,58 L300,150" stroke="#f0d36b" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="70" y="24" text-anchor="middle" class="s">부드러운 조명</text>

  <!-- 탑뷰 카메라 시야 -->
  <path d="M352,72 L150,262 L560,262 Z" fill="#ebe6fd" opacity="0.55"/>
  <rect x="330" y="40" width="44" height="26" rx="4" fill="#27262b"/>
  <circle cx="352" cy="70" r="6" fill="#5c5962"/>
  <line x1="352" y1="26" x2="352" y2="40" stroke="#27262b" stroke-width="3"/>
  <text x="384" y="58" class="h" style="fill:#5a3fd1">탑뷰 카메라</text>

  <!-- 작업대 -->
  <rect x="120" y="262" width="460" height="10" rx="2" fill="#c9c5cf"/>
  <line x1="140" y1="272" x2="140" y2="320" stroke="#c9c5cf" stroke-width="6"/>
  <line x1="560" y1="272" x2="560" y2="320" stroke="#c9c5cf" stroke-width="6"/>

  <!-- 손목 카메라 시야 -->
  <path d="M290,190 L268,252 L334,252 Z" fill="#cfeedd" opacity="0.9"/>
  <!-- 팔 -->
  <rect x="166" y="250" width="54" height="12" rx="3" fill="#0d8a5f"/>
  <path d="M193,250 L193,178 L270,150 L300,214" class="arm" stroke="#0d8a5f" stroke-width="10"/>
  <path d="M300,214 L291,232 M300,214 L311,231" class="arm" stroke="#0d8a5f" stroke-width="4.5"/>
  <!-- 손목 카메라 -->
  <rect x="279" y="178" width="20" height="13" rx="3" fill="#27262b" transform="rotate(66 289 184)"/>
  <!-- 물체 -->
  <rect x="290" y="238" width="22" height="22" rx="2" fill="#f2a33a" stroke="#c46a00" stroke-width="1.5"/>
  <text x="301" y="290" text-anchor="middle" class="s">시작 위치</text>
  <rect x="470" y="236" width="70" height="26" rx="3" fill="#ffffff" stroke="#8a8590" stroke-width="1.5"/>
  <text x="505" y="290" text-anchor="middle" class="s">목표 지점</text>
  <text x="193" y="290" text-anchor="middle" class="s">팔 받침</text>

  <!-- 설명 -->
  <rect x="595" y="24" width="190" height="92" rx="8" fill="#ebe6fd" stroke="#7253ed" stroke-width="1.2"/>
  <text x="607" y="46" class="h" style="fill:#5a3fd1">탑뷰 카메라</text>
  <text x="607" y="68" class="s">시작 위치, 목표 지점, 그 사이</text>
  <text x="607" y="86" class="s">동작을 모두 담는다. 팔을 가장</text>
  <text x="607" y="104" class="s">멀리 뻗어도 잘리지 않게</text>

  <rect x="595" y="128" width="190" height="92" rx="8" fill="#e3f4ec" stroke="#0d8a5f" stroke-width="1.2"/>
  <text x="607" y="150" class="h" style="fill:#0d6b4a">손목 카메라</text>
  <text x="607" y="172" class="s">그리퍼 손가락과 잡을 물체가</text>
  <text x="607" y="190" class="s">함께 보이게. 빠르게 움직이니</text>
  <text x="607" y="208" class="s">글로벌 셔터가 좋다</text>

  <rect x="595" y="232" width="190" height="92" rx="8" fill="#fff8e1" stroke="#d8a400" stroke-width="1.2"/>
  <text x="607" y="254" class="h" style="fill:#8a6a00">조명</text>
  <text x="607" y="276" class="s">작업대 전체를 고르게. 창문</text>
  <text x="607" y="294" class="s">햇빛은 피하고 자동 노출과</text>
  <text x="607" y="312" class="s">화이트밸런스는 끈다</text>
</svg>
