<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">텔레오퍼레이션으로 시연 데이터 모으기</title>
  <desc id="d">사람이 리더암을 움직이면 팔로워암이 같은 각도로 따라 움직이고, 탑뷰와 손목 카메라 영상과 관절 각도가 함께 한 에피소드로 기록된다</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5962"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #27262b; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13.5px; fill: #3d3b42; }
    .s { font-size: 12.5px; fill: #5c5962; }
    .arm { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="800" height="360" fill="#ffffff"/>

  <!-- 사람 -->
  <circle cx="75" cy="118" r="18" fill="#f1eff5" stroke="#5c5962" stroke-width="2"/>
  <path d="M75,138 L75,200 M75,155 L118,170 M75,200 L58,240 M75,200 L92,240" class="arm" stroke="#5c5962" stroke-width="4"/>
  <text x="75" y="268" text-anchor="middle" class="h">사람</text>
  <text x="75" y="288" text-anchor="middle" class="s">리더암을 손으로</text>
  <text x="75" y="304" text-anchor="middle" class="s">움직인다</text>

  <!-- 리더암 -->
  <rect x="150" y="60" width="200" height="200" rx="10" fill="#ebe6fd" stroke="#7253ed" stroke-width="1.5"/>
  <text x="250" y="86" text-anchor="middle" class="h">리더암</text>
  <rect x="190" y="226" width="56" height="12" rx="3" fill="#7253ed"/>
  <path d="M218,226 L218,170 L276,140 L298,176" class="arm" stroke="#7253ed" stroke-width="9"/>
  <path d="M298,176 L290,192 M298,176 L310,190" class="arm" stroke="#7253ed" stroke-width="4"/>
  <circle cx="124" cy="171" r="6" fill="#5c5962"/>
  <text x="250" y="252" text-anchor="middle" class="s">조종용 팔 (작고 가벼움)</text>

  <!-- 전달 화살표 -->
  <line x1="352" y1="160" x2="438" y2="160" stroke="#5c5962" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="395" y="146" text-anchor="middle" class="s">같은 각도로</text>
  <text x="395" y="182" text-anchor="middle" class="s">따라 움직임</text>

  <!-- 팔로워암 작업대 -->
  <rect x="440" y="20" width="340" height="240" rx="10" fill="#e3f4ec" stroke="#0d8a5f" stroke-width="1.5"/>
  <text x="520" y="46" text-anchor="middle" class="h">팔로워암</text>
  <line x1="460" y1="238" x2="760" y2="238" stroke="#9aa39e" stroke-width="3"/>
  <rect x="480" y="226" width="60" height="12" rx="3" fill="#0d8a5f"/>
  <path d="M510,226 L510,150 L590,118 L622,184" class="arm" stroke="#0d8a5f" stroke-width="11"/>
  <path d="M622,184 L612,204 M622,184 L634,202" class="arm" stroke="#0d8a5f" stroke-width="5"/>
  <circle cx="624" cy="224" r="13" fill="#f2a33a" stroke="#c46a00" stroke-width="1.5"/>
  <rect x="680" y="214" width="60" height="24" rx="3" fill="#ffffff" stroke="#8a8590" stroke-width="1.5"/>
  <text x="710" y="230" text-anchor="middle" class="s">상자</text>

  <!-- 손목 카메라 -->
  <rect x="598" y="150" width="22" height="14" rx="3" fill="#27262b" transform="rotate(64 609 157)"/>
  <line x1="604" y1="150" x2="586" y2="104" stroke="#5c5962" stroke-width="1"/>
  <text x="584" y="98" text-anchor="end" class="s">손목 카메라</text>

  <!-- 탑뷰 카메라 -->
  <rect x="664" y="54" width="40" height="24" rx="4" fill="#27262b"/>
  <circle cx="684" cy="80" r="6" fill="#5c5962"/>
  <path d="M676,86 L600,232 M692,86 L770,232" fill="none" stroke="#7a7680" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="712" y="70" class="s">탑뷰 카메라</text>

  <!-- 기록 -->
  <rect x="150" y="285" width="630" height="58" rx="10" fill="#f6f5f9" stroke="#d7d5dd" stroke-width="1.5"/>
  <text x="465" y="309" text-anchor="middle" class="b">에피소드 1개 = 카메라 영상(탑뷰, 손목) + 팔로워 관절 각도 + 사람이 준 동작</text>
  <text x="465" y="331" text-anchor="middle" class="s">이것을 수십 번 반복해 모은 것이 데이터셋이다. 모델은 「이 장면이면 이렇게 움직인다」를 배운다</text>
  <line x1="610" y1="262" x2="610" y2="282" stroke="#5c5962" stroke-width="2" marker-end="url(#ah)"/>
</svg>
