title: 카카오 공작소 Physical AI
description: 카카오 공작소 동호회가 Physical AI(로봇팔, 모방학습, VLA)를 공부하며 모은 공개 참고자료
lang: ko
url: "https://kakao-workshop.github.io"
baseurl: "/physical-ai"

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "맨 위로"

aux_links:
  "GitHub": "https://github.com/kakao-workshop/physical-ai"
aux_links_new_tab: true

footer_content: "카카오 공작소 동호회의 비공식 학습 자료입니다. 회사의 공식 입장이나 서비스와 관계가 없습니다."

last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"
gh_edit_link: true
gh_edit_link_text: "GitHub에서 고치기"
gh_edit_repository: "https://github.com/kakao-workshop/physical-ai"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  note:
    title: 참고
    color: blue
  warning:
    title: 주의
    color: yellow
  tip:
    title: 팁
    color: green

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
